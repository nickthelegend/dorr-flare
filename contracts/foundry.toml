[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments.json" }]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
flare = "https://flare-api.flare.network/ext/C/rpc"
songbird = "https://songbird-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "", url = "https://coston2-explorer.flare.network/api" }
flare = { key = "", url = "https://flare-explorer.flare.network/api" }
